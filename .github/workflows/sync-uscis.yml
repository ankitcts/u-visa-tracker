name: Sync USCIS data

# Nightly check that compares the canonical USCIS I-918 quarterly XLSX
# (referenced in src/lib/data.ts → USCIS_FILE_VERIFIED.sha256) against
# the live file on uscis.gov. If the SHA differs, the script regenerates
# the ANNUAL_PRINCIPAL / ANNUAL_DERIVATIVE arrays + USCIS_FILE_VERIFIED
# block and this workflow opens a `bug/uscis-data-sync-YYYYMMDD` PR for
# review. If the XLSX schema drifted, the script exits non-zero and this
# workflow fails loudly so a human can update the parser.
#
# Runs at 0 7 UTC (≈ 2am CST), one hour after the cache-bust cron at
# /api/cron/refresh, so a same-night sequence is: cache busted → fresh
# data PR opens → human reviews + merges → release tag → production.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-uscis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run USCIS sync (fetch + diff + maybe write new snapshot)
        id: sync
        run: node scripts/sync-uscis.mjs

      - name: Open PR if a new snapshot landed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%d-%H%M)
          branch="bug/uscis-data-sync-${ts}"
          summary="${{ steps.sync.outputs.summary }}"
          snapshot_id="${{ steps.sync.outputs.snapshot-id }}"

          git config user.name "uscis-data-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          # Only data files — never source code.
          git add public/data/index.json "public/data/snapshots/${snapshot_id}.json"
          git commit -m "Sync USCIS data: ${summary}

          Auto-generated by .github/workflows/sync-uscis.yml. The script
          (scripts/sync-uscis.mjs) detected that the upstream USCIS I-918
          quarterly XLSX has a different SHA256 than the one recorded in
          the latest snapshot. A NEW snapshot file was written at
          public/data/snapshots/${snapshot_id}.json (immutable —
          never overwrites prior snapshots) and the public/data/index.json
          pointer was bumped to it.

          NO source code (src/) changes — this PR is data-only.

          REVIEWER: please confirm the cell-level diff matches what USCIS
          actually published (skim the XLSX and spot-check a few FYs).
          The script's parser is layout-aware but USCIS occasionally
          changes column groupings — schema drift would have failed the
          workflow loudly, so a passing run here means the parse looked
          structurally fine."

          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "data: USCIS sync — ${summary}" \
            --body "Automated USCIS data sync. **Data-only PR** — no source code changes; the site is fully decoupled from data updates.

          ## What changed
          - **Summary:** ${summary}
          - **New snapshot:** \`public/data/snapshots/${snapshot_id}.json\`
          - **Index pointer bumped to:** \`${snapshot_id}\`
          - Triggered by: \`${{ github.event_name }}\` on \`${{ github.run_id }}\`
          - Source script: [scripts/sync-uscis.mjs](../blob/main/scripts/sync-uscis.mjs)
          - Workflow: [sync-uscis.yml](../blob/main/.github/workflows/sync-uscis.yml)

          ## Reviewer checklist
          - [ ] The cell-level diff in the new snapshot matches the new XLSX (skim a few FYs in the file referenced by \`source.url\`).
          - [ ] No FY rows were silently dropped — annual count should equal the prior count or grow by 1 (new FY) only.
          - [ ] Spot-check the U-1 cap math: principal \`approved\` should still be ≤ 10 000 / FY (with rare carryover edge cases).
          - [ ] Prior snapshots in \`public/data/snapshots/\` are unchanged (this PR adds one new file + edits index.json only).

          ## After merge
          The deploy that ships this snapshot is purely a static-asset shuffle (no \`src/\` changes, so Next.js's build cache hits everywhere). Per the release-pipeline skill: cut a \`v1.x.y-rc.N\` tag → verify on https://u-visa-tracker.vercel.app → cut the matching final tag for production.
          "

      - name: No-op summary
        if: steps.sync.outputs.changed != 'true'
        run: |
          {
            echo "### USCIS sync — no change"
            echo ""
            echo "Upstream XLSX SHA matches \`USCIS_FILE_VERIFIED.sha256\` — no PR opened."
          } >> "$GITHUB_STEP_SUMMARY"
