name: Deploy RC to Vercel

# Triggers ONLY on release-candidate tag pushes (e.g. v1.4.2-rc.1).
# Final release tags (v1.4.2) and main pushes do not deploy — by design.
# See ~/.claude/skills/release-pipeline/SKILL.md for the full workflow.

on:
  push:
    tags:
      - 'v*-rc.*'

concurrency:
  group: vercel-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy ${{ github.ref_name }} to Vercel production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project metadata (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_REF_NAME to $url"

      - name: Annotate run summary
        run: |
          {
            echo "### RC deploy complete"
            echo ""
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
